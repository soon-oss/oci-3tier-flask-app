name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Check out the code
    - uses: actions/checkout@v3

    # 2. Set up Python environment
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    # 3. Install Dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        # Only install if requirements.txt exists
        if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi

    # 4. Lint Code (Check for syntax errors)
    - name: Lint with flake8
      run: |
        # stop the build if there are syntax errors
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    # 5. Build Docker Image
    - name: Build Docker Image
      run: docker build . --file Dockerfile --tag my-flask-app:latest

    # 6. Security Scan
    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'my-flask-app:latest'
        format: 'table'
        exit-code: '0' 
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'