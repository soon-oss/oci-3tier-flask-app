version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-db
    environment:
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}
      - APP_USER=${APP_USER}
      - APP_USER_PASSWORD=${APP_USER_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./db/seed.sql:/container-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "sqlplus -L -S ${APP_USER}/${APP_USER_PASSWORD}@//localhost:1521/FREEPDB1 <<< 'SELECT 1 FROM DUAL;'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-app
    environment:
      - DB_USER=${APP_USER}
      - DB_PASSWORD=${APP_USER_PASSWORD}
      - DB_HOST=oracle-db
      - DB_PORT=1521
      - DB_SERVICE=FREEPDB1
    ports:
      - "5000:5000"
    depends_on:
      oracle-db:
        condition: service_healthy

volumes:
  oracle_data: